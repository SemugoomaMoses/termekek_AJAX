<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termékek</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
  
        <div id="hiba"></div>

        <section id="termek-felso">

            <div class="kep-resz">
                <img id="termek-kep" src="" alt="">
                <div id="belyegek"></div>
            </div>

            <div class="adatok">
                <span class="uj">ÚJ</span>
                <h1 id="termek-nev"></h1>
                <p id="termek-leiras"></p>
                <p id="termek-ertekeles"></p>
                <p id="termek-ar"></p>
                <p id="termek-keszlet"></p>
                <div class="gombok">
                    <button id="kosar-gomb"><i class="bi bi-cart3"></i> Kosárba</button>
                    <button id="kedvenc-gomb"><i class="bi bi-heart"></i> Kedvencekhez</button>
                </div>
            </div>

            <aside class="gyarto">
                <p><i class="bi bi-building"></i> Gyártó: <strong id="gyarto-nev"></strong></p>
                <p><i class="bi bi-globe2"></i> Származási ország: <strong id="gyarto-orszag"></strong></p>
                <p><i class="bi bi-shield-check"></i> Garancia: <strong>2 év</strong></p>
                <p><i class="bi bi-truck"></i> Szállítás: <strong>1-3 munkanap</strong></p>
            </aside>

        </section>


        <section id="termek-also">

            <div class="bal-resz">
                <div class="fulek">
                    <button class="ful aktiv" data-ful="ful-leiras">Leírás</button>
                    <button class="ful" data-ful="ful-tulajdonsagok">Tulajdonságok</button>
                    <button class="ful" data-ful="ful-velemenyek">Vélemények (<span id="velemeny-db">0</span>)</button>
                </div>

                <div id="ful-leiras" class="panel aktiv">
                    <p id="hosszu-leiras"></p>
                    <div class="kartyak">
                        <div class="kartya"><i class="bi bi-lightning-charge"></i>Kiemelkedő teljesítmény</div>
                        <div class="kartya"><i class="bi bi-controller"></i>Tökéletes játékélmény</div>
                        <div class="kartya"><i class="bi bi-display"></i>Lenyűgöző kijelző</div>
                        <div class="kartya"><i class="bi bi-gear-wide-connected"></i>Fejlesztéshez ideális</div>
                    </div>
                </div>

                <div id="ful-tulajdonsagok" class="panel">
                    <table id="tulajdonsagok"></table>
                </div>

                <div id="ful-velemenyek" class="panel">
                    <div id="velemenyek-ful"></div>
                </div>
            </div>

            <div class="jellemzok-resz">
                <h3>Főbb jellemzők</h3>
                <ul id="jellemzok"></ul>
            </div>

            <div class="velemenyek-resz">
                <h3>Vásárlói vélemények</h3>
                <div id="velemenyek"></div>
                 <a href="#" id="osszes-velemeny" class="osszes">Összes vélemény megtekintése <i class="bi bi-arrow-right"></i></a>
            </div>

        </section>

        
    </main>

    <script src="main.js"></script>
</body>
</html>
