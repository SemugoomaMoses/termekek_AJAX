<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termékek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!-- ide jön a hibaüzenet, ha nem sikerül a betöltés -->
        <div id="hiba"></div>

        <!-- felső rész: kép + név + ár + gombok -->
        <section id="termek-felso">

            <div class="kep-resz">
                <img id="termek-kep" src="" alt="">
                <div id="belyegek"></div>
            </div>

            <div class="adatok">
                <h1 id="termek-nev"></h1>
                <p id="termek-leiras"></p>
                <p id="termek-ertekeles"></p>
                <p id="termek-ar"></p>
                <p id="termek-keszlet"></p>
                <div class="gombok">
                    <button id="kosar-gomb">Kosárba</button>
                    <button id="kedvenc-gomb">Kedvencekhez</button>
                </div>
            </div>

            <aside class="gyarto">
                <p>Gyártó: <strong id="gyarto-nev"></strong></p>
                <p>Származási ország: <strong id="gyarto-orszag"></strong></p>
                <p>Garancia: <strong>2 év</strong></p>
                <p>Szállítás: <strong>1-3 munkanap</strong></p>
            </aside>

        </section>

        <!-- alsó rész: leírás, főbb jellemzők, vélemények -->
        <section id="termek-also">

            <div class="leiras-resz">
                <h3>Leírás</h3>
                <p id="hosszu-leiras"></p>
            </div>

            <div class="jellemzok-resz">
                <h3>Főbb jellemzők</h3>
                <ul id="jellemzok"></ul>
            </div>

            <div class="velemenyek-resz">
                <h3>Vásárlói vélemények</h3>
                <div id="velemenyek"></div>
            </div>

        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
